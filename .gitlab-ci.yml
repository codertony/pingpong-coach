# 持续集成（GitLab）。
#
# 与 `.github/workflows/ci.yml` 是**同一套门禁**，三个 job 一一对应：
#
# - verify：与本地 `pnpm verify` 对齐；
# - e2e：真实 Chromium 跑浏览器测试。会自起 5 个进程，含一个 live 模式 API
#   实例指向本地假供应商 —— 用来覆盖"模型输出经服务端校验"（红线 8）那条路径；
# - docker：只验证镜像**能构建出来**，不起容器。拦住"Dockerfile 被改坏却无人察觉"。
#
# 为什么两个平台的配置都保留：仓库同时托管在 GitHub 与 GitLab 上，它们各有各的
# 运行器，**一份配置只对自己那个平台生效**。改门禁时两处都要改 ——
# 只改一处的结果是"另一个平台上悄悄少跑了几步"。
#
# 需要说明的边界：本流水线运行在托管的 Ubuntu 上，没有摄像头，
# 也无法在 CI 里做真实动作识别质量验证。它只能证明
# 「代码契约与工程纪律成立」，不能证明「识别准确」。
# 真实质量验证见 docs/acceptance.md。

workflow:
  # 与 GitHub 那边的触发条件对齐：推 main、开 MR、以及手动触发。
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - verify
  - e2e
  - docker

variables:
  # 把 store 放进项目目录，才能被下面的 cache 命中（与 GitHub 那边的 cache: pnpm 等价）。
  PNPM_STORE: "$CI_PROJECT_DIR/.pnpm-store"

# 需要 Node + pnpm 的 job 共用这一段。
.pnpm-base:
  image: node:22.13.1
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    # 版本不写死在这里：pnpm 版本由 package.json 的 `packageManager` 字段决定，
    # corepack 会读它。写死一个数字就有了第二处真相。
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile

verify:
  extends: .pnpm-base
  stage: verify
  timeout: 20 minutes
  script:
    - pnpm typecheck
    - pnpm lint
    - pnpm format:check
    # 本项目反复出现的缺陷形状不是"函数算错了"，而是**函数根本没被调用**。
    # 零调用的函数测试全绿也说明不了任何事（见 docs/known-failures.md F-016）。
    - pnpm audit:wiring
    - pnpm check:docs
    - pnpm test
    - pnpm build
    - pnpm check:bundle

e2e:
  extends: .pnpm-base
  stage: e2e
  timeout: 20 minutes
  script:
    # 集成测试会起第二个 API 实例（live 模式），它要托管 `apps/web/dist`
    # 并提供 SPA 回退。不先构建的话那条链路在 CI 上没有产物可用。
    - pnpm build
    - pnpm --filter @pingpong/web exec playwright install --with-deps chromium
    - pnpm test:e2e

docker:
  stage: docker
  image: docker:27
  timeout: 30 minutes
  interruptible: true
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  script:
    # 只做**构建**验证，不起容器 —— 目的是拦住"Dockerfile 被改坏却没人发现"。
    # 构建会在镜像内跑 pnpm install / models:fetch（校验 sha256）/ build，
    # 所以这一步同时验证了依赖、模型来源与构建产物三者都还成立。
    #
    # 说明：这一步会真实下载约 22 MB 模型。受限网络下会失败 ——
    # 那时应当显式跳过（或加 --build-arg SKIP_MODELS=1），而不是删掉这个 job。
    - docker build -t pingpong-coach:ci .
